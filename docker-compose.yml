services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pubdevloop
      POSTGRES_PASSWORD: pubdevloop
      POSTGRES_DB: pubdevloop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubdevloop -d pubdevloop"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: .
    command: sh -c "npm run db:migrate && npm run start"
    ports: ["${API_PORT:-3000}:3000"]
    env_file: .env
    environment: { DATABASE_URL: postgres://pubdevloop:pubdevloop@postgres:5432/pubdevloop }
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: sh -c "npm run db:migrate && npm run worker"
    env_file: .env
    environment:
      DATABASE_URL: postgres://pubdevloop:pubdevloop@postgres:5432/pubdevloop
      ROUTER_API_KEY: ${ROUTER_API_KEY}
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  postgres_data:
