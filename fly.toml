app = "pub-dev-loop-9router"
primary_region = "iad"

[build]
  image = "registry.fly.io/pub-dev-loop-9router:latest"

[env]
  PORT = "20128"
  DATA_DIR = "/app/data"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

[[mounts]]
  source = "9router_data"
  destination = "/app/data"

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/v1/models"
