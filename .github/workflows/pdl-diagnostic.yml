name: PDL Diagnostic

on:
  push:
    branches:
      - feat/pdl-onboard-pub-neural
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run Vitest with JSON report
        shell: bash
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=vitest-diagnostic.json
          status=$?
          echo "VITEST_EXIT_CODE=$status" > vitest-exit-code.txt
          exit 0
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdl-vitest-diagnostic
          path: |
            vitest-diagnostic.json
            vitest-exit-code.txt
          if-no-files-found: warn
