name: PDL Pub Neural Onboarding Test

on:
  push:
    branches:
      - feat/pdl-onboard-pub-neural
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run onboarding test only
        run: npx vitest run tests/pdl/pub-neural-onboarding.test.ts --reporter=verbose
