name: Build & Deploy — Cloudflare Container

# Dispara em push para feat/pub-prototype-mode e via workflow_dispatch.
# O runner ubuntu-latest tem Docker Engine nativo (sem Docker Desktop).
#
# Fluxo:
#   checkout → CI (typecheck/build/test) → wrangler deploy
#   → Wrangler: docker build Dockerfile.worker no runner
#   → push para registry.cloudflare.com (Cloudflare Managed Registry)
#   → rollout do PubDevLoopWorkerContainer (instance_type: basic / 4 GB)

on:
  push:
    branches:
      - feat/pub-prototype-mode
  workflow_dispatch:
    inputs:
      rollout_strategy:
        description: "Container rollout strategy"
        required: false
        default: "immediate"
        type: choice
        options:
          - immediate
          - none

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: CI — typecheck / build / test
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: CI — typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@pub-dev-loop.internal"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build CF Worker
        run: npm run build:cf

      - name: Unit tests
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Docker build → Cloudflare Managed Registry → Container rollout
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy — Cloudflare Container
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # Wrangler lê CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID automaticamente.
      # Não expor os valores — eles chegam apenas via GitHub Secrets.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN nao configurado em GitHub Secrets."
            echo "Acesse: github.com/pubcoreagencia/pub-dev-loop > Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID nao configurado em GitHub Secrets."
            exit 1
          fi
          echo "Cloudflare secrets presentes."

      - name: Verify Docker Engine (nativo no ubuntu-latest)
        run: |
          docker version
          docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve rollout strategy
        id: rollout
        run: |
          STRATEGY="${{ github.event.inputs.rollout_strategy }}"
          STRATEGY="${STRATEGY:-immediate}"
          echo "strategy=${STRATEGY}" >> "$GITHUB_OUTPUT"
          echo "Rollout strategy: ${STRATEGY}"

      # wrangler deploy com "image": "./Dockerfile.worker" no wrangler.jsonc:
      #   1. executa docker build usando o Docker Engine do runner
      #   2. push para registry.cloudflare.com (Cloudflare Managed Registry)
      #   3. deploya o Worker script
      #   4. executa o rollout do container com a estrategia definida
      - name: Deploy Worker + Container (build + push + rollout)
        id: deploy
        run: |
          set -euo pipefail
          echo "=== Deploy ==="
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Rollout: ${{ steps.rollout.outputs.strategy }}"
          npx wrangler deploy \
            --containers-rollout="${{ steps.rollout.outputs.strategy }}"

      # ── Post-deploy: diagnóstico ──────────────────────────────────────────────

      - name: List containers (estado pos-deploy)
        if: always()
        run: npx wrangler containers list

      - name: Inspect PubDevLoopWorkerContainer
        if: always()
        run: npx wrangler containers info a0324901-4a8d-414a-a42c-a48461f52621 || true

      - name: Listar imagens no Cloudflare Registry (confirmar nova imagem)
        if: always()
        run: npx wrangler containers images list

      # ── Smoke tests ───────────────────────────────────────────────────────────

      - name: Smoke test — GET /health (espera 200)
        id: smoke_health
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://pub-dev-loop-api.contato-pubcore.workers.dev/health)
          echo "GET /health => HTTP ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::/health retornou ${HTTP_STATUS} (esperado 200)"
            exit 1
          fi
          echo "/health => 200 OK"

      - name: Smoke test — POST /prototype/session sem API key (espera 401)
        id: smoke_auth
        continue-on-error: true
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://pub-dev-loop-api.contato-pubcore.workers.dev/prototype/session \
            -X POST -H "Content-Type: application/json" -d '{}')
          echo "POST /prototype/session (sem API key) => HTTP ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "401" ]; then
            echo "::warning::/prototype/session retornou ${HTTP_STATUS} (esperado 401)"
            exit 1
          fi
          echo "Auth confirmado => 401 Unauthorized"

      # ── Deployment summary ────────────────────────────────────────────────────

      - name: Deployment summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'SUMMARY'
          ## Cloudflare Container Deploy

          | Campo | Valor |
          |---|---|
          | Worker | pub-dev-loop-api |
          | Container | PubDevLoopWorkerContainer |
          | Instance type | basic (4 GB disk / 1 GiB RAM) |
          | Gateway | OpenRouter (primary) |
          | 9Router | fallback futuro (desabilitado) |
          | 127.0.0.1:20128 | NAO referenciado em producao |
          SUMMARY
          echo "| Branch | ${GITHUB_REF_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${GITHUB_SHA} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rollout | ${{ steps.rollout.outputs.strategy }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | ${{ steps.deploy.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| /health | ${{ steps.smoke_health.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| /prototype auth | ${{ steps.smoke_auth.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
