name: Codex cloud worker proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-hello:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGENT_TIMEOUT_MS: "900000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Git
        id: git
        run: git --version

      - name: Install Codex CLI
        id: codex_install
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          CODEX_BIN="$(find "$HOME" -type f -name codex -perm -u+x -print -quit)"
          test -n "$CODEX_BIN"
          dirname "$CODEX_BIN" >> "$GITHUB_PATH"

      - name: Verify Codex CLI
        id: codex
        shell: bash
        run: |
          set -euo pipefail
          codex --version
          codex --help > codex-help.txt
          codex exec --help > codex-exec-help.txt
          {
            echo "## Codex CLI"
            echo ""
            echo "### Version"
            codex --version
            echo ""
            echo "### codex --help"
            sed -n '1,220p' codex-help.txt
            echo ""
            echo "### codex exec --help"
            sed -n '1,220p' codex-exec-help.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Codex authentication secret
        id: auth
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "status=configured" >> "$GITHUB_OUTPUT"
          else
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Unit tests
        id: unit
        run: npm test

      - name: Create disposable Git sandbox
        shell: bash
        run: |
          set -euo pipefail
          SANDBOX="$(mktemp -d)"
          git init "$SANDBOX"
          git -C "$SANDBOX" config user.name "PUB DEV LOOP Test"
          git -C "$SANDBOX" config user.email "test@pub.dev.loop"
          printf '%s\n' '# Codex sandbox' > "$SANDBOX/README.md"
          git -C "$SANDBOX" add README.md
          git -C "$SANDBOX" commit -m "test: initialize sandbox"
          echo "CODEX_INTEGRATION_REPOSITORY=$SANDBOX" >> "$GITHUB_ENV"

      - name: Real Codex hello integration
        id: integration
        env:
          RUN_CODEX_INTEGRATION: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run test:integration

      - name: Worker report
        if: always()
        env:
          AUTH_STATUS: ${{ steps.auth.outputs.status || 'not-run' }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          UNIT_TEST_STATUS: ${{ steps.unit.outcome }}
          INTEGRATION_TEST_STATUS: ${{ steps.integration.outcome || 'not-run' }}
        shell: bash
        run: |
          {
            echo "## Codex cloud worker report"
            echo "- CODEX CLI STATUS: ${{ steps.codex.outcome || 'not-run' }}"
            echo "- CODEX VERSION: $(codex --version 2>/dev/null || echo unavailable)"
            echo "- CODEX EXEC HELP: available in previous step summary"
            echo "- NODE VERSION: $(node --version)"
            echo "- GIT VERSION: $(git --version)"
            echo "- AUTH STATUS: $AUTH_STATUS"
            echo "- BUILD STATUS: $BUILD_STATUS"
            echo "- UNIT TEST STATUS: $UNIT_TEST_STATUS"
            echo "- INTEGRATION TEST STATUS: $INTEGRATION_TEST_STATUS"
            echo "- GIT BRANCH: worker/codex/TASK-000005 (local only)"
            echo "- GIT COMMIT: produced only inside the disposable sandbox"
            echo "- RESULT: $INTEGRATION_TEST_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
