# TASK-000032: Staging deployment override
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up --build
#
# Staging uses RouterWorker with 9Router provider (TASK-000030 retry/fallback active).
# Requires real 9Router credentials and a real Git repository with clone access.
#
# Port 3001 is used for the API to avoid conflict with Hermes desktop (port 3000).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pubdevloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pubdevloop}
      POSTGRES_DB: pubdevloop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubdevloop -d pubdevloop"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes: [postgres_staging_data:/var/lib/postgresql/data]

  api:
    build: .
    command: sh -c "npm run db:migrate && npm run start"
    ports: ["${API_PORT:-3001}:3000"]
    env_file: [.env, .env.staging]
    environment:
      # Explicitly unset AGENT_MODE to force provider path (override .env default)
      AGENT_MODE: ""
      PORT: "3000"
      API_PORT: "3001"
      DATABASE_URL: postgres://pubdevloop:pubdevloop@postgres:5432/pubdevloop
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: sh -c "npm run db:migrate && npm run worker"
    env_file: [.env, .env.staging]
    environment:
      # Explicitly unset AGENT_MODE to force provider path (override .env default)
      AGENT_MODE: ""
      PORT: "3001"
      # TMPDIR ensures workspaces go to a known location
      TMPDIR: /tmp
      DATABASE_URL: postgres://pubdevloop:${POSTGRES_PASSWORD:-pubdevloop}@postgres:5432/pubdevloop
      # Git credentials for private repo access — passed from host env at runtime
      # Token is NEVER in code, in .env files, or in repository URLs.
      # Git credential helper reads from ~/.netrc (created at worker startup).
      GIT_TOKEN: ${GITHUB_TOKEN}
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 30s
      timeout: 15s
      retries: 3

volumes:
  postgres_staging_data:
